name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - name: Tag matches packages/mcp-server and server.json
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('packages/mcp-server/package.json', 'utf8')).version;
          const tag = process.env.GITHUB_REF_NAME.slice(1);
          const manifest = JSON.parse(readFileSync('server.json', 'utf8'));
          if (version !== tag || manifest.version !== tag) {
            console.error('Tag v' + tag + ' does not match package ' + version + ' or server.json ' + manifest.version);
            process.exit(1);
          }
          "
      - run: pnpm --filter chatterpilot build
      - run: pnpm --filter chatterpilot publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
