name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real chats, customer names, phone numbers or prices.** Describe the shape and use invented values.
        Security problems: please report privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce with synthetic data
      description: Commands you ran, and a few invented chat lines in the same format as yours.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version, OS, Node.js version
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no real chat content or personal data.
          required: true
